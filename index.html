    <script>
      (function () {
        // Prevent benign HMR WebSocket connection closed warnings from triggering error overlays
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && (event.reason || event);
          var msg = String((reason && (reason.message || reason.stack || reason)) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = String((event && (event.message || event.error)) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });
      })();
    </script>
